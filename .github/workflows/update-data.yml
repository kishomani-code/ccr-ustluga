# Automatic data update for the site app (CCR, D48, cold cables and OTHER AREA).
# Upload the new Excel files into the "input" folder on GitHub -> this job builds data.json (CCR),
# data_d48.json (D48), data_cold.json (cold cables / heat tracing) and the areas/ folder (dashboard +
# OTHER AREA, one file per title) from the same files, refreshes the phone cache name in sw.js,
# removes the uploaded Excel files and saves a log in input/LAST_UPDATE.txt.
name: Update app data

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Any Excel files?
        id: chk
        run: |
          n=$(find input -type f -iname '*.xls*' | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Excel files in input: $n"

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.count != '0'
        with:
          python-version: '3.12'

      - name: Install readers
        if: steps.chk.outputs.count != '0'
        run: pip install openpyxl pyxlsb

      - name: Build data.json (CCR)
        if: steps.chk.outputs.count != '0'
        run: |
          set -o pipefail
          echo "===== CCR =====" | tee build_log.txt
          python3 tools/build_data.py --site ccr --input input \
            --base data_base.json --current data.json --out data.json 2>&1 | tee -a build_log.txt

      - name: Build data_d48.json (D48)
        if: steps.chk.outputs.count != '0'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== D48 =====" | tee -a build_log.txt
          python3 tools/build_data.py --site d48 --input input \
            --base tools/d48_skeleton.json --current data_d48.json \
            --out data_d48.json 2>&1 | tee -a build_log.txt

      - name: Build data_cold.json (cold cables – heat tracing)
        if: steps.chk.outputs.count != '0'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== COLD =====" | tee -a build_log.txt
          python3 tools/build_data.py --site cold --input input \
            --base tools/cold_skeleton.json --current data_cold.json \
            --out data_cold.json 2>&1 | tee -a build_log.txt

      - name: Build areas/ (total dashboard + OTHER AREA)
        if: steps.chk.outputs.count != '0'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "===== AREAS =====" | tee -a build_log.txt
          cp areas/cold_drawings.json /tmp/cold_drawings.json 2>/dev/null || true
          python3 tools/build_areas.py --input input --out areas \
            --date "$(TZ=Europe/Moscow date '+%d.%m.%Y')" 2>&1 | tee -a build_log.txt
          cp /tmp/cold_drawings.json areas/cold_drawings.json 2>/dev/null || true

      - name: New cache name so phones load the new data
        if: steps.chk.outputs.count != '0'
        run: |
          stamp=$(date -u +%Y%m%d%H%M)
          sed -i -E "s/(const CACHE = '[^']*)-d[0-9]{12}'/\1'/" sw.js
          sed -i -E "s/(const CACHE = '[^']*)'/\1-d${stamp}'/" sw.js
          grep "const CACHE" sw.js

      - name: Save, remove uploaded Excel files, keep log
        if: steps.chk.outputs.count != '0'
        run: |
          mkdir -p input
          echo "Last update: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') MSK" > input/LAST_UPDATE.txt
          find input -type f -iname '*.xls*' -printf '%f\n' >> input/LAST_UPDATE.txt
          cat build_log.txt >> input/LAST_UPDATE.txt
          find input -type f -iname '*.xls*' -delete
          git config user.name ccr-auto-update
          git config user.email ccr-auto-update@users.noreply.github.com
          git add -A input data.json data_d48.json data_cold.json areas sw.js
          git commit -m "Automatic data update" || echo "nothing to commit"
          git push
