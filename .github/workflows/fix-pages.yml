# One-time fix: cancel the stuck GitHub Pages deployment (v4.6, 60e661e) and request a fresh Pages build.
name: Fix stuck Pages deployment
on:
  push:
    paths: ['.github/workflows/fix-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  contents: read
  deployments: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck deployment and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          for id in 60e661ef97dd9ac28c681f36ee969278a6afa8ea 7470597925; do
            echo "== status of $id"; gh api repos/$R/pages/deployments/$id || true
            echo "== cancel $id"; gh api -i -X POST repos/$R/pages/deployments/$id/cancel | head -1 || true
          done
          echo "== mark environment deployment 7470597925 inactive"
          gh api -X POST repos/$R/deployments/7470597925/statuses -f state=inactive -q .state || true
          sleep 20
          for id in 60e661ef97dd9ac28c681f36ee969278a6afa8ea 7470597925; do echo "== status after $id"; gh api repos/$R/pages/deployments/$id || true; done
          echo "== request a new Pages build"
          gh api -X POST repos/$R/pages/builds || echo "build request failed"
