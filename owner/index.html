<!doctype html>
<html lang="en">
<head>

<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mut:#5b6b82;--line:#d9e1ec;--acc:#0f2747;--acc2:#1d4e89;--ok:#1f7a45;--bad:#b42318;--warn:#b26b00;--sel:#e8f0fb}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:13.5px/1.45 "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{width:30px;height:30px;border-radius:6px;background:#fff}header .tt b{font-size:16px}header .tt span{opacity:.75;font-size:11.5px;display:block}
header .sp{flex:1}header label{font-size:12px;opacity:.85}header input[type=date]{font:inherit;border:0;border-radius:6px;padding:4px 8px;margin-left:6px}

main{flex:1;padding:18px 22px;min-width:0}
h2{margin:0 0 2px;font-size:19px}p.mut{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}

td.num,th.num{text-align:right;white-space:nowrap}tr:hover td{background:#fafcff}
td input.q{width:72px;text-align:right;font:inherit;border:1px solid var(--line);border-radius:5px;padding:2px 5px}
td input.t{width:120px;font:inherit;border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.tw{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:8px}.tw th{top:0}

.fc .h{display:flex;align-items:center;gap:8px}.fc .h b{flex:1}.fc small{color:var(--mut)}

#login{max-width:380px;margin:80px auto}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cmp div{background:#f6f8fb;border-radius:6px;padding:5px 8px}
@media (max-width:760px){nav{display:none}.wrap{display:block}}

<body>
<header><img src="icon-192.png" alt=""><div class="tt"><b>GPP E&amp;I Owner</b><span>Ust-Luga GPP · Electrical &amp; Instrumentation · RHI</span></div><div class="sp"></div>
<label>Report date <input type="date" id="rdate" onchange="setDate(this.value)"></label></header>
<div id="login" class="card"><h2>Owner login</h2><p class="mut">Owner password required.</p>
<input class="f" type="password" id="pw" placeholder="Password" style="width:200px" onkeydown="if(event.key==='Enter')login()"> <button onclick="login()">Unlock</button><div id="pwmsg" class="err" style="margin-top:8px"></div></div>
<div class="wrap" id="app" style="display:none">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="busy"><div><div class="spin"></div><b id="busyT">Reading…</b><div class="small mut" id="busyS"></div></div></div>
<div id="toast"></div>
<script src="xlsx.full.min.js"></script>
<script src="jszip.min.js"></script>
<script>
'use strict';
const PW = '548477', VER = '1.0';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const N = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const r2 = v => Math.round(v * 100) / 100;
const fm = v => (Math.round(v * 100) / 100).toLocaleString('ru-RU');
const NT = s => String(s || '').toUpperCase().replace(/[^A-Z0-9А-ЯЁ]/g, '');
function toast(t, ms) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', ms || 2600); }
function busy(on, t, s) { $('busy').style.display = on ? 'flex' : 'none'; if (t) $('busyT').textContent = t; $('busyS').textContent = s || ''; }
const LS = {get(k, d) { try { const v = localStorage.getItem('gppo_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('gppo_' + k, JSON.stringify(v)); } catch (e) {} }};

// ---------------- settings & state
const ST = {titles: LS.get('titles', 'G0-D1810BX0; G0-D1801FX0'), date: '', page: LS.get('page', 'files')};
const titles = () => ST.titles.split(/[;,\s]+/).map(s => s.trim()).filter(Boolean);
const DATA = {};            // kind -> {name, at, res}
const REP = LS.get('rep', {});    // IWP daily report lines: acc -> {q, src}
const PUL = LS.get('pul', []);    // tracker pulls: {tag, m, drum, iwp}
const TER = LS.get('ter', []);    // tracker terminations: {tag, side}
const saveRep = () => { LS.set('rep', REP); LS.set('pul', PUL); LS.set('ter', TER); };
function setDate(v) { ST.date = v; render(); }
const dIso = () => ST.date || new Date().toISOString().slice(0, 10);
const dRu = () => dIso().split('-').reverse().join('.');
const dSerial = () => { const [y, m, d] = dIso().split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5); };

// ---------------- IndexedDB cache of the parsed files
const IDB = {db: null, open() { return new Promise(res => { try { const r = indexedDB.open('gpp_owner', 1); r.onupgradeneeded = () => r.result.createObjectStore('d'); r.onsuccess = () => { IDB.db = r.result; res(); }; r.onerror = () => res(); } catch (e) { res(); } }); },
  put(k, v) { return new Promise(res => { if (!IDB.db) return res(); try { const t = IDB.db.transaction('d', 'readwrite'); t.objectStore('d').put(v, k); t.oncomplete = res; t.onerror = res; } catch (e) { res(); } }); },
  all() { return new Promise(res => { if (!IDB.db) return res({}); const o = {}; try { const t = IDB.db.transaction('d'); const c = t.objectStore('d').openCursor(); c.onsuccess = () => { const x = c.result; if (x) { o[x.key] = x.value; x.continue(); } else res(o); }; c.onerror = () => res(o); } catch (e) { res(o); } }); },
  del(k) { return new Promise(res => { if (!IDB.db) return res(); try { const t = IDB.db.transaction('d', 'readwrite'); t.objectStore('d').delete(k); t.oncomplete = res; } catch (e) { res(); } }); }};

// ---------------- source files
const KINDS = [
  {k: 'iwp', nm: 'IWP status', pat: /iwp.?status/i, ex: 'Md_EL_IWP_Status_dd.mm.yyyy.xlsb', use: 'IWP report · RFI → IWP'},
  {k: 'trk', nm: 'Cable tracker', pat: /cable.?tracker/i, ex: 'Md_Cable_Tracker_L3_dd.mm.yyyy.xlsb', use: 'IWP report · tracker update'},
  {k: 'rawp', nm: 'Cable RAWP', pat: /rawp/i, ex: 'Cable_RAWP_Inspection_Progress_Rxx.xlsb', use: 'RFI accepted → IWP'},
  {k: 'mpunch', nm: 'Master (client) punch', pat: /master.?punch/i, ex: 'Master_Punch_List_dd.mm.yyyy.xlsx', use: 'RHI punch to close'},
  {k: 'rpunch', nm: 'RHI internal punch', pat: /internal.?punch/i, ex: 'EI_Internal_Punch_register.xlsx', use: 'RHI punch to close'}];
function kindOf(name) { const k = KINDS.find(x => x.pat.test(name)); return k && k.k; }
function parseFile(kind, file) { return new Promise((res, rej) => { const rd = new FileReader();
  rd.onload = () => { const w = new Worker('worker.js'); w.onmessage = e => { w.terminate(); e.data.ok ? res(e.data.res) : rej(new Error(e.data.err)); };
    w.onerror = e => { w.terminate(); rej(new Error(e.message || 'Worker failed (file too big for memory?)')); };
    w.postMessage({kind, buf: rd.result, titles: titles()}, [rd.result]); };
  rd.onerror = () => rej(new Error('Cannot read the file')); rd.readAsArrayBuffer(file); }); }
async function loadFiles(files) { const list = [...files].map(f => ({f, k: kindOf(f.name)}));
  const bad = list.filter(x => !x.k); if (bad.length) toast('Not recognised: ' + bad.map(x => x.f.name).join(', '), 5000);
  for (const x of list.filter(x => x.k)) { const K = KINDS.find(y => y.k === x.k);
    busy(true, `Reading ${K.nm}…`, `${x.f.name} · ${(x.f.size / 1048576).toFixed(1)} MB · big files take 10–40 s`);
    try { const res = await parseFile(x.k, x.f); const v = {name: x.f.name, at: Date.now(), mod: x.f.lastModified, res, titles: ST.titles};
      DATA[x.k] = v; await IDB.put(x.k, v); IX = null; toast(`${K.nm}: ${res.n.toLocaleString()} rows read in ${res.sec.toFixed(0)} s`); }
    catch (e) { busy(false); alertBox(`${K.nm}: ${e.message}`); } }
  busy(false); render(); }
function alertBox(t) { const m = $('main'); m.insertAdjacentHTML('afterbegin', `<div class="card err">${esc(t)}</div>`); }
function pick(kind) { const i = document.createElement('input'); i.type = 'file'; i.accept = '.xlsx,.xlsb,.xlsm,.xls'; i.multiple = !kind; i.onchange = () => loadFiles(i.files); i.click(); }

// ---------------- indexes built from the loaded data
let IX = null;
const isLay = m => /cable (laying|pulling)/i.test(m || ''), isTerm = m => /cable termination/i.test(m || '');
function ix() { if (IX) return IX; const I = {acc: {}, tag: {}, trk: {}, rawp: [], ok: {}};
  const iw = DATA.iwp && DATA.iwp.res.rows || [];
  iw.forEach((r, i) => { const a = String(r[12] == null ? '' : r[12]).replace(/\.0+$/, ''); if (!a) return; const o = {i, r, acc: a, map: r[0], tag: String(r[8] || ''), q: N(r[13]), f: N(r[14]), co: r[17] || ''};
    I.acc[a] = o; const t = NT(o.tag); if (t) (I.tag[t] = I.tag[t] || []).push(o); });
  (DATA.trk && DATA.trk.res.rows || []).forEach(r => { I.trk[NT(r[0])] = r; });
  return IX = I; }
const lines = (tag, fn) => (ix().tag[NT(tag)] || []).filter(o => fn(o.map));
const left = o => r2(Math.max(o.q - o.f - N((REP[o.acc] || {}).q), 0));
function distribute(L, qty) { const out = []; let rest = qty; L.forEach(o => { if (rest <= 0.001) return; const room = r2(Math.max(o.q - o.f, 0)); const q = r2(Math.min(room, rest)); if (q > 0) { out.push([o, q]); rest = r2(rest - q); } }); return {out, rest}; }
function addRep(acc, q, src) { if (!(q > 0)) return; const e = REP[acc]; REP[acc] = {q: e ? Math.max(e.q, q) : q, src: e && e.src !== src ? e.src + ' + ' + src : src}; }

// ---------------- IWP daily report: tracker pulled metres not yet in IWP (CCR cables)
function autoIWP() { const I = ix(), out = [], noline = [];
  (DATA.trk && DATA.trk.res.rows || []).forEach(t => { const act = N(t[11]); if (act <= 0) return;
    const L = lines(t[0], isLay); if (!L.length) { noline.push(t); return; }
    const fact = L.reduce((s, o) => s + o.f, 0), site = L.reduce((s, o) => s + o.q, 0);
    if (act <= fact + 0.5 || fact >= site - 0.01) return;
    const want = r2(Math.min(act, site) - fact); const d = distribute(L, want);
    d.out.forEach(([o, q]) => out.push({o, q, t, act, over: act > site + 0.5})); });
  return {out, noline}; }
// client RFI accepted -> IWP not 100 %
const acc_ = s => /accept|принят/i.test(s || '') && !/reject|отклон/i.test(s || '');
function rfiIWP() { const out = [], miss = [];
  (DATA.rawp && DATA.rawp.res.rows || []).forEach(r => {
    [['Pulling', isLay, 2, 3, 4, 5], ['Termination', isTerm, 6, 7, 8, 9]].forEach(([act, fn, iI, iN, iR, iD]) => {
      if (!acc_(r[iR])) return; if (act === 'Termination' && r[6] && r[6] === r[2]) return;
      const L = lines(r[0], fn); if (!L.length) { if (r[iI] && r[iI] !== '-') miss.push({r, act, rf: r[iN], dt: r[iD]}); return; }
      L.forEach(o => { const rem = r2(o.q - o.f); if (rem > 0.001) out.push({o, q: rem, r, act, rf: r[iN], res: r[iR], dt: r[iD]}); }); }); });
  return {out, miss}; }
// RHI punch open, all client punches with the same tag + title closed
const closed = s => /закр|clos|отмен|cancel/i.test(s || '');
function punchClose() { const G = {}; const key = (tag, tit) => NT(tag) + '|' + tit;
  (DATA.mpunch && DATA.mpunch.res.rows || []).forEach(p => { if (!NT(p[3])) return; const g = G[key(p[3], p[1])] = G[key(p[3], p[1])] || {c: [], r: []}; g.c.push(p); });
  (DATA.rpunch && DATA.rpunch.res.rows || []).forEach(p => { if (!NT(p[3])) return; const g = G[key(p[3], p[1])]; if (g) g.r.push(p); });
  const out = []; const dk = s => String(s || '').split('.').reverse().join('');
  Object.values(G).forEach(g => { if (!g.r.length || g.c.some(p => !closed(p[7]))) return; const cl = g.c.slice().sort((a, b) => dk(b[8]).localeCompare(dk(a[8])));
    g.r.filter(p => !closed(p[6])).forEach(p => out.push({p, cl})); });
  return out; }

// ---------------- Excel writer that keeps the user's sample styling (template xlsx + style row)
const XE = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
const colL = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
function fillSheet(xml, styleRow, data) {
  const rx = new RegExp(`<row r="${styleRow}"[^>]*?(?:/>|>([\\s\\S]*?)</row>)`); const m = xml.match(rx); if (!m) throw new Error('template style row missing');
  const rowAttr = (m[0].match(/^<row([^>]*?)\/?>/)[1] || '').replace(/\s*r="\d+"/, '').replace(/\s*spans="[^"]*"/, '');
  const st = []; (m[1] || '').replace(/<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>)/g, (_, c, a) => { const s = (a.match(/\ss="(\d+)"/) || [])[1]; let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; st[n - 1] = s; return ''; });
  // drop the style row and every row after it
  const head = xml.slice(0, xml.indexOf('<sheetData>') + 11), body = xml.slice(xml.indexOf('<sheetData>') + 11, xml.indexOf('</sheetData>')), tail = xml.slice(xml.indexOf('</sheetData>'));
  const keep = (body.match(/<row\b[^>]*\/>|<row\b[^>]*[^\/]>[\s\S]*?<\/row>/g) || []).filter(r => Number(r.match(/ r="(\d+)"/)[1]) < styleRow).join('');
  let out = ''; data.forEach((row, i) => { const rn = styleRow + i; out += `<row r="${rn}"${rowAttr}>`;
    row.forEach((v, c) => { const ref = colL(c) + rn, s = st[c] != null ? ` s="${st[c]}"` : '';
      if (v === null || v === undefined || v === '') out += `<c r="${ref}"${s}/>`;
      else if (typeof v === 'boolean') out += `<c r="${ref}"${s} t="b"><v>${v ? 1 : 0}</v></c>`;
      else if (typeof v === 'number' && isFinite(v)) out += `<c r="${ref}"${s}><v>${v}</v></c>`;
      else out += `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${XE(v)}</t></is></c>`; });
    out += '</row>'; });
  const last = styleRow + Math.max(data.length, 1) - 1; const ncol = Math.max(st.length, 1);
  return (head + keep + out + tail).replace(/<dimension ref="[^"]*"\/>/, `<dimension ref="A1:${colL(ncol - 1)}${last}"/>`); }
async function saveTpl(tpl, sheets, name, patch) { const buf = await (await fetch(tpl)).arrayBuffer(); const z = await JSZip.loadAsync(buf);
  for (const [path, styleRow, data] of sheets) { let x = await z.file(path).async('string'); x = fillSheet(x, styleRow, data); if (patch) x = patch(path, x); z.file(path, x); }
  const blob = await z.generateAsync({type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE'}); dl(blob, name); }
function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast('Saved to Downloads: ' + name, 3500); }
const numv = v => { if (v === null || v === undefined || v === '') return null; if (typeof v === 'number' || typeof v === 'boolean') return v; const s = String(v).trim(); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : s; };
const iwpRow = (o, q) => o.r.map((v, c) => c === 12 ? (Number(v) || v) : numv(v)).concat([q]);
async function exportIWP(L, fname) { if (!L.length) return toast('Nothing to export');
  await saveTpl('tpl_iwp.xlsx', [['xl/worksheets/sheet1.xml', 5, L.map(x => iwpRow(x.o, x.q))]], fname,
    (p, x) => x.replace(/(<c r="S1"[^>]*>)<v>[^<]*<\/v>/, `$1<v>${dSerial()}</v>`)); }
async function exportTracker() { const I = ix(); const loc = t => { const m = String(t[4]).match(/\((G\d-[A-Z0-9]+)\)/); return m ? m[1] : t[1]; };
  const pr = PUL.map(p => { const t = I.trk[NT(p.tag)]; return t ? [loc(t), t[2], numv(t[3]), t[0], t[5], p.drum || t[6], numv(t[7]), t[8], t[9], N(p.m), dRu(), 'RHI'] : ['', '', '', p.tag, '', p.drum || '', '', '', '', N(p.m), dRu(), 'RHI']; });
  const tr = TER.map(e => { const t = I.trk[NT(e.tag)]; const sd = termSide(e); return [t ? t[1] : '', t ? t[2] : '', t ? numv(t[3]) : '', t ? t[0] : e.tag, sd === 'from' ? dRu() : null, sd === 'to' ? dRu() : null, 1]; });
  if (!pr.length && !tr.length) return toast('Nothing to export');
  await saveTpl('tpl_trk.xlsx', [['xl/worksheets/sheet1.xml', 6, pr], ['xl/worksheets/sheet2.xml', 2, tr]], `Tracker_update_${dRu()}.xlsx`); }
