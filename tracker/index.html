<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPP Cable Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icon-192.png">
<meta name="theme-color" content="#0f2747">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mut:#5b6b82;--line:#d9e1ec;--acc:#0f2747;--acc2:#1d4e89;--ok:#1f7a45;--bad:#b42318;--warn:#a05a00}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--acc);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hr{display:flex;align-items:center;gap:10px;max-width:1300px;margin:0 auto}
.hr img{width:30px;height:30px;border-radius:6px;background:#fff}.hr .tt{flex:1}.hr b{font-size:16px}.hr span{display:block;font-size:11.5px;opacity:.75}
.hr a{color:#fff;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:6px}.hr a.on,.hr a:hover{background:rgba(255,255,255,.15)}
.sb{max-width:1300px;margin:8px auto 0;display:flex;gap:8px}
.sb input{flex:1;font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;border:0}
main{max-width:1300px;margin:0 auto;padding:14px 16px 40px}
h2{margin:4px 0 2px;font-size:19px}.mut{color:var(--mut)}.small{font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mut)}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:#f3f6fa;font-weight:600;color:#33415c;position:sticky;top:0;white-space:nowrap;cursor:pointer}
td.n,th.n{text-align:right;white-space:nowrap}tr.click{cursor:pointer}tr.click:hover td{background:#f5f9ff}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;white-space:nowrap;background:#e8edf4;color:var(--mut)}
.pill.ok{background:#e3f4ea;color:var(--ok)}.pill.bad{background:#fbe7e5;color:var(--bad)}.pill.warn{background:#fff1d6;color:var(--warn)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar .sp{flex:1}
select,button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
button{background:var(--acc2);color:#fff;border-color:var(--acc2);cursor:pointer}button.sec{background:#fff;color:var(--acc2)}
.kv{display:grid;grid-template-columns:220px 1fr;gap:0}.kv div{padding:6px 8px;border-bottom:1px solid var(--line);font-size:13.5px}.kv div:nth-child(odd){color:var(--mut);background:#fafbfd}
.prog{height:8px;background:#e8edf4;border-radius:5px;overflow:hidden;min-width:80px}.prog i{display:block;height:100%;background:var(--ok)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px}
#load{text-align:center;padding:60px 10px}.spin{width:30px;height:30px;border:3px solid #d7e1ee;border-top-color:var(--acc2);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}
a.lnk{color:var(--acc2);text-decoration:none;cursor:pointer}a.lnk:hover{text-decoration:underline}
@media(max-width:700px){.kv{grid-template-columns:120px 1fr}.hr a{padding:6px 6px;font-size:12px}.hide-m{display:none}}
</style>
</head>
<body>
<header><div class="hr"><img src="../icon-192.png" alt=""><div class="tt"><b>GPP Cable Tracker</b><span id="sub">Ust-Luga GPP · E&amp;I · loading…</span></div>
<a href="#/" id="n-h">Overview</a><a href="#/c" id="n-c">Cables</a><a href="#/d" id="n-d">Drums</a></div>
<div class="sb"><input id="q" placeholder="Search cable tag, drum (GMR…), panel / JB, title, ident, MRF…" autocomplete="off"></div></header>
<main id="m"><div id="load"><div class="spin"></div>Loading cable tracker (about 1 MB)…</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id), M=()=>$('m');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9А-ЯЁ]/g,'');
const fm=v=>v===''||v==null?'':(Math.round(Number(v)*10)/10).toLocaleString('ru-RU');
const pct=(a,b)=>b?Math.round(100*a/b):0;
let DB=null, C=[], DR={}, VS={c:{tit:'',co:'',ps:'',lim:200,sk:'t',sd:1},d:{flt:'',lim:200,sk:'need',sd:-1}};
const enc=encodeURIComponent, dec=decodeURIComponent;
function load(){ fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{DB=d;build();route();}).catch(e=>{M().innerHTML='<div class="card">Could not load the data: '+esc(e)+'</div>';}); }
function build(){ const c=DB.cols,dt=DB.dict,n=DB.n;
  const g=(k,i)=>dt[k]?dt[k][c[k][i]]:c[k][i];
  const keys=Object.keys(c);
  for(let i=0;i<n;i++){ const o={i}; for(const k of keys) o[k]=g(k,i);
    o.pulled=/complet/i.test(o.ps)||Number(o.act)>0; o.term=/^complet/i.test(o.ts); o.del=!!o.oth; o._n=N(o.t); o._s=N(o.t+' '+o.f+' '+o.o+' '+o.du+' '+o.da+' '+o.mrf+' '+o.mrfs+' '+o.id); C.push(o); }
  // drums
  const D={}; const add=(dn,o,k)=>{ if(!dn||!/\d/.test(dn))return; const d=D[dn]=D[dn]||{dn,used:[],asg:[],info:DB.drums[dn]||[]}; d[k].push(o); };
  C.forEach(o=>{ add(o.du,o,'used'); if(o.da&&o.da!==o.du) add(o.da,o,'asg'); else if(o.da&&!o.pulled) add(o.da,o,'asg'); });
  Object.values(D).forEach(d=>{ d.len=Number(d.info[0])||0; d.pm=d.used.reduce((s,o)=>s+(Number(o.act)||0),0); d.free=d.len?d.len-d.pm:null;
    d.rem=d.asg.filter(o=>!o.pulled&&!o.del); d.need=d.rem.reduce((s,o)=>s+(Number(o.ln)||0),0); d.short=d.free!=null&&d.need>d.free+0.5; d.rc=d.rem.length; d.tk=(d.info[1]||'');
    const mode=a=>{const c={};a.forEach(x=>{if(x)c[x]=(c[x]||0)+1});return Object.keys(c).sort((x,y)=>c[y]-c[x])[0]||'';}; d.id=mode([...d.used,...d.asg].map(o=>o.id)); d.ty=mode([...d.used,...d.asg].map(o=>(o.ty+' '+o.sz).trim())); d._n=N(d.dn); });
  DR=D; $('sub').textContent=`Ust-Luga GPP · E&I · ${DB.n.toLocaleString('ru-RU')} cables · ${Object.keys(D).length.toLocaleString('ru-RU')} drums · ${DB.src} · drums: ${DB.dist}`;
}
window.addEventListener('hashchange',route);
let qt; $('q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>{const v=$('q').value.trim(); if(v.length>=2) location.hash='#/s/'+enc(v); else if(!v) location.hash='#/';},250);});
function nav(k){['h','c','d'].forEach(x=>$('n-'+x).classList.toggle('on',x===k));}
function route(){ if(!DB)return; const h=location.hash.replace(/^#\//,''); const [k,...r]=h.split('/'); const a=dec(r.join('/')); window.scrollTo(0,0);
  if(k==='c'&&a) return cable(a); if(k==='c') return cables(); if(k==='d'&&a) return drum(a); if(k==='d') return drums(); if(k==='s') return search(a); if(k==='t') {VS.c.tit=a;return cables();} return home(); }
const st=o=>o.del?'<span class="pill">other project / deleted</span>':o.hold?'<span class="pill bad">HOLD</span>':o.pulled?'<span class="pill ok">Pulled</span>':'<span class="pill warn">Remaining</span>';
const tst=o=>o.term?'<span class="pill ok">Terminated</span>':(o.tf||o.tt)?'<span class="pill warn">1 end</span>':'<span class="pill">Not terminated</span>';
function home(){ nav('h'); const L=C.filter(o=>!o.del); const T={};
  L.forEach(o=>{const t=T[o.tit]=T[o.tit]||{t:o.tit,n:0,p:0,tm:0,dl:0,pm:0,rh:0}; t.n++; if(o.pulled)t.p++; if(o.term)t.tm++; t.dl+=Number(o.ln)||0; t.pm+=Number(o.act)||0; if(o.co==='RHI')t.rh++;});
  const n=L.length,p=L.filter(o=>o.pulled).length,tm=L.filter(o=>o.term).length,dl=L.reduce((s,o)=>s+(Number(o.ln)||0),0),pm=L.reduce((s,o)=>s+(Number(o.act)||0),0);
  const sh=Object.values(DR).filter(d=>d.short&&d.rem.length).length;
  M().innerHTML=`<h2>Overview</h2><div class="mut small">Cable tracker ${esc(DB.src)} · built ${esc(DB.date)}</div>
  <div class="kpis"><div class="kpi"><b>${n.toLocaleString('ru-RU')}</b><span>cables (active)</span></div><div class="kpi ok"><b>${pct(p,n)}%</b><span>pulled · ${p.toLocaleString('ru-RU')} cables</span></div>
  <div class="kpi"><b>${pct(tm,n)}%</b><span>terminated · ${tm.toLocaleString('ru-RU')}</span></div><div class="kpi"><b>${fm(Math.round(pm/1000))} km</b><span>pulled of ${fm(Math.round(dl/1000))} km design</span></div>
  <div class="kpi bad"><b>${sh}</b><span>drums short for their remaining cables</span></div></div>
  <div class="card"><h3>By title</h3><div class="tw"><table><thead><tr><th>Title</th><th class="n">Cables</th><th class="n">Pulled</th><th class="n">Remaining</th><th>Pulled %</th><th class="n hide-m">Terminated</th><th class="n hide-m">Design m</th><th class="n hide-m">Pulled m</th><th class="n hide-m">RHI</th></tr></thead><tbody>
  ${Object.values(T).sort((a,b)=>b.n-a.n).map(t=>`<tr class="click" onclick="location.hash='#/t/${enc(t.t)}'"><td><a class="lnk">${esc(t.t||'—')}</a></td><td class="n">${t.n}</td><td class="n">${t.p}</td><td class="n">${t.n-t.p}</td><td><div class="prog"><i style="width:${pct(t.p,t.n)}%"></i></div><span class="small">${pct(t.p,t.n)}%</span></td><td class="n hide-m">${t.tm}</td><td class="n hide-m">${fm(t.dl)}</td><td class="n hide-m">${fm(t.pm)}</td><td class="n hide-m">${t.rh}</td></tr>`).join('')}
  </tbody></table></div></div>`; }
function cables(){ nav('c'); const v=VS.c; const tits=[...new Set(C.map(o=>o.tit))].filter(Boolean).sort(), cos=[...new Set(C.map(o=>o.co))].filter(Boolean).sort();
  let L=C.filter(o=>(!v.tit||o.tit===v.tit)&&(!v.co||o.co===v.co)&&(!v.ps||(v.ps==='p'?o.pulled&&!o.del:v.ps==='r'?!o.pulled&&!o.del&&!o.hold:v.ps==='h'?o.hold:v.ps==='t'?o.term:v.ps==='nt'?o.pulled&&!o.term&&!o.del:v.ps==='x'?o.del:true)));
  const k=v.sk,s=v.sd; L.sort((a,b)=>{const x=a[k],y=b[k]; return (typeof x==='number'||typeof y==='number')?((Number(x)||0)-(Number(y)||0))*s:String(x).localeCompare(String(y))*s;});
  const opt=(a,sel,lab)=>`<option value="">${lab}</option>`+a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
  M().innerHTML=`<h2>Cables</h2><div class="bar"><select onchange="VS.c.tit=this.value;VS.c.lim=200;cables()">${opt(tits,v.tit,'All titles')}</select><select onchange="VS.c.co=this.value;VS.c.lim=200;cables()">${opt(cos,v.co,'All companies')}</select>
  <select onchange="VS.c.ps=this.value;VS.c.lim=200;cables()">${[['','All statuses'],['p','Pulled'],['r','Remaining'],['h','HOLD'],['nt','Pulled, not terminated'],['t','Terminated'],['x','Other project / deleted']].map(([a,b])=>`<option value="${a}" ${v.ps===a?'selected':''}>${b}</option>`).join('')}</select>
  <span class="sp"></span><span class="mut small">${L.length.toLocaleString('ru-RU')} cables · ${fm(L.reduce((s,o)=>s+(Number(o.ln)||0),0))} m design · ${fm(L.reduce((s,o)=>s+(Number(o.act)||0),0))} m pulled</span><button class="sec" onclick="csv(cables.L,'cables')">⬇ CSV</button></div>
  ${ctable(L.slice(0,v.lim),true)}${L.length>v.lim?`<div style="text-align:center;margin-top:10px"><button class="sec" onclick="VS.c.lim+=500;cables()">Show more (${(L.length-v.lim).toLocaleString('ru-RU')})</button></div>`:''}`; cables.L=L; }
function ctable(L,sortable){ const H=[['t','Cable tag'],['tit','Title'],['ty','Type'],['ln','Design m'],['act','Pulled m'],['da','Drum'],['ps','Status'],['ts','Termination'],['co','Company']];
  const th=H.map(([k,l])=>`<th class="${['ln','act'].includes(k)?'n':''}${['ty','ts','co','tit'].includes(k)?' hide-m':''}" ${sortable?`onclick="VS.c.sd=VS.c.sk==='${k}'?-VS.c.sd:1;VS.c.sk='${k}';cables()"`:''}>${l}${sortable&&VS.c.sk===k?(VS.c.sd>0?' ▲':' ▼'):''}</th>`).join('');
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${L.map(o=>`<tr class="click" onclick="location.hash='#/c/${enc(o.t)}'"><td><a class="lnk">${esc(o.t)}</a><div class="small mut">${esc(short(o.f))} → ${esc(short(o.o))}</div></td><td class="hide-m">${esc(o.tit)}</td><td class="hide-m">${esc(o.ty)} ${esc(o.sz)}</td><td class="n">${fm(o.ln)}</td><td class="n">${fm(o.act)}</td><td>${o.da?`<a class="lnk" onclick="event.stopPropagation();location.hash='#/d/${enc(o.da)}'">${esc(o.da)}</a>`:''}${o.du&&o.du!==o.da?`<div class="small mut">used ${esc(o.du)}</div>`:''}</td><td>${st(o)}</td><td class="hide-m">${tst(o)}</td><td class="hide-m">${esc(o.co)}</td></tr>`).join('')||'<tr><td colspan="9" class="mut">No cables</td></tr>'}</tbody></table></div>`; }
const short=s=>{s=String(s||'');const m=s.match(/(G\d-[A-Z0-9]+-[A-Z0-9().\-]+)\s*\*?\)?\s*$/);return m?m[1]:s.slice(-40);};
function cable(t){ nav('c'); const L=C.filter(o=>o.t===t); if(!L.length){M().innerHTML='<div class="card">Cable not found</div>';return;}
  M().innerHTML=L.map(o=>`<h2>${esc(o.t)} ${st(o)} ${tst(o)}</h2><div class="mut small">${esc(o.tit)} · ${esc(o.doc)} rev ${esc(o.rev)}</div>
  <div class="card" style="margin-top:10px"><h3>Cable</h3><div class="kv">${kv([['From',o.f],['To',o.o],['Type / cores',(o.ty+' '+o.sz).trim()],['Ident',o.id],['Design length',fm(o.ln)+' m'],['Discipline',o.disc],['Subsystem',(o.sub+' '+o.subn).trim()],['Company',o.co],['Responsible',o.resp],['Contractor',o.ctr],['TQ',o.tq],['HOLD',o.hold],['Other project / deleted',o.oth],['Comments GSP / RHI',o.cm]])}</div></div>
  <div class="card"><h3>Pulling &amp; drum</h3><div class="kv">${kv([['Pull status',o.ps],['Pulled (before termination)',o.act!==''?fm(o.act)+' m':''],['After termination',o.aft!==''?fm(o.aft)+' m':''],['Pull date',o.pd],['Drum used',o.du?`<a class="lnk" href="#/d/${enc(o.du)}">${esc(o.du)}</a>`:'',1],['Drum assigned ('+esc(DB.dist)+')',o.da?`<a class="lnk" href="#/d/${enc(o.da)}">${esc(o.da)}</a>`:'',1],['Earlier distributions',o.dists],['MRF',o.mrf+(o.mrfd?' · '+o.mrfd:'')],['MRF (site)',o.mrfs]])}</div></div>
  <div class="card"><h3>Termination &amp; inspection</h3><div class="kv">${kv([['Termination status',o.ts],['From end date',o.tf],['To end date',o.tt],['RFI',o.rfi+(o.rfid?' · '+o.rfid:'')]])}</div></div>`).join(''); }
function kv(a){ return a.filter(x=>x[1]!==''&&x[1]!=null&&x[1]!=='m'&&x[1]!==' m').map(([k,v,raw])=>`<div>${esc(k)}</div><div>${raw?v:esc(v)}</div>`).join(''); }
function drums(){ nav('d'); const v=VS.d; let L=Object.values(DR);
  if(v.flt==='short') L=L.filter(d=>d.short&&d.rem.length); else if(v.flt==='rem') L=L.filter(d=>d.rem.length); else if(v.flt==='free') L=L.filter(d=>(d.free||0)>0&&!d.rem.length);
  const k=v.sk,s=v.sd; L.sort((a,b)=>{const x=a[k],y=b[k]; return (typeof x==='number'||typeof y==='number'||x==null)?((Number(x)||0)-(Number(y)||0))*s:String(x).localeCompare(String(y))*s;});
  const H=[['dn','Drum'],['ty','Cable type'],['len','Drum m'],['pm','Pulled from drum m'],['free','Free m'],['need','Remaining cables m'],['rc','Remaining cables'],['tk','Taken by']];
  M().innerHTML=`<h2>Drums</h2><div class="bar"><select onchange="VS.d.flt=this.value;VS.d.lim=200;drums()">${[['','All drums'],['rem','With remaining cables'],['short','Short for remaining cables'],['free','Free length, no cables assigned']].map(([a,b])=>`<option value="${a}" ${v.flt===a?'selected':''}>${b}</option>`).join('')}</select><span class="sp"></span><span class="mut small">${L.length.toLocaleString('ru-RU')} drums</span></div>
  <div class="tw"><table><thead><tr>${H.map(([k,l])=>`<th class="${['len','pm','free','need','rc'].includes(k)?'n':''}${['ty','tk'].includes(k)?' hide-m':''}" onclick="VS.d.sd=VS.d.sk==='${k}'?-VS.d.sd:1;VS.d.sk='${k}';drums()">${l}${v.sk===k?(v.sd>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>
  ${L.slice(0,v.lim).map(d=>`<tr class="click" onclick="location.hash='#/d/${enc(d.dn)}'"><td><a class="lnk">${esc(d.dn)}</a></td><td class="hide-m">${esc(d.ty)}</td><td class="n">${fm(d.len)}</td><td class="n">${fm(d.pm)}</td><td class="n">${d.free==null?'':fm(d.free)}</td><td class="n">${fm(d.need)}</td><td class="n">${d.rem.length}${d.short&&d.rem.length?' <span class="pill bad">short</span>':''}</td><td class="hide-m">${esc(d.info[1]||'')}</td></tr>`).join('')}</tbody></table></div>
  ${L.length>v.lim?`<div style="text-align:center;margin-top:10px"><button class="sec" onclick="VS.d.lim+=500;drums()">Show more</button></div>`:''}`; }
function drum(dn){ nav('d'); const d=DR[dn]; if(!d){M().innerHTML='<div class="card">Drum not found in the cable tracker</div>';return;}
  const pulledAsg=d.asg.filter(o=>o.pulled&&o.du!==dn);
  M().innerHTML=`<h2>Drum ${esc(dn)} ${d.short&&d.rem.length?'<span class="pill bad">short for remaining cables</span>':d.rem.length?'<span class="pill ok">enough for remaining cables</span>':''}</h2><div class="mut small">${esc(d.ty)} · ident ${esc(d.id)}</div>
  <div class="kpis"><div class="kpi"><b>${fm(d.len)||'—'}</b><span>drum length m</span></div><div class="kpi"><b>${fm(d.pm)}</b><span>pulled from drum m · ${d.used.length} cables</span></div>
  <div class="kpi ${d.free!=null&&d.free<0?'bad':''}"><b>${d.free==null?'—':fm(d.free)}</b><span>free on drum m (tracker)</span></div><div class="kpi ${d.short?'bad':''}"><b>${fm(d.need)}</b><span>needed for ${d.rem.length} remaining cables m</span></div></div>
  <div class="card"><h3>Drum info (cable tracker)</h3><div class="kv">${kv([['Taken by contractor',d.info[1]],['Assigned to organisations',d.info[2]],['Warehouse stock (ident)',d.info[3]],['Delivery forecast',d.info[4]],['Balance',d.free==null?'':(d.short?`SHORT ${fm(d.need-d.free)} m`:`after remaining cables ${fm(d.free-d.need)} m left`)]])}</div></div>
  <div class="grp">Remaining cables assigned to this drum (${d.rem.length})</div>${ctable(d.rem)}
  <div class="grp">Cables pulled from this drum (${d.used.length})</div>${ctable(d.used)}
  ${pulledAsg.length?`<div class="grp">Assigned to this drum but pulled from another drum (${pulledAsg.length})</div>${ctable(pulledAsg)}`:''}
  <div style="margin-top:10px"><button class="sec" onclick="csv([...DR['${esc(dn)}'].rem,...DR['${esc(dn)}'].used],'drum_${esc(dn).replace(/\W/g,'_')}')">⬇ CSV of this drum</button></div>
  <div class="small mut" style="margin-top:8px">Free = drum length minus metres booked on this drum in the tracker. Measure the drum on site before pulling.</div>`; }
function search(q){ nav(''); const n=N(q); if(!n){home();return;}
  const ds=Object.values(DR).filter(d=>d._n.includes(n)).slice(0,30);
  const cs=C.filter(o=>o._s.includes(n)); cs.sort((a,b)=>(b._n.startsWith(n)-a._n.startsWith(n))||(a.del-b.del));
  const ts=[...new Set(C.map(o=>o.tit))].filter(t=>N(t).includes(n));
  M().innerHTML=`<h2>Search “${esc(q)}”</h2>
  ${ds.length?`<div class="grp">Drums (${ds.length})</div><div class="tw"><table><thead><tr><th>Drum</th><th>Type</th><th class="n">Drum m</th><th class="n">Pulled m</th><th class="n">Free m</th><th class="n">Remaining cables</th></tr></thead><tbody>${ds.map(d=>`<tr class="click" onclick="location.hash='#/d/${enc(d.dn)}'"><td><a class="lnk">${esc(d.dn)}</a></td><td>${esc(d.ty)}</td><td class="n">${fm(d.len)}</td><td class="n">${fm(d.pm)}</td><td class="n">${d.free==null?'':fm(d.free)}</td><td class="n">${d.rem.length} · ${fm(d.need)} m${d.short&&d.rem.length?' <span class="pill bad">short</span>':''}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${ts.length?`<div class="grp">Titles</div>${ts.map(t=>`<a class="lnk" href="#/t/${enc(t)}">${esc(t)}</a>`).join(' · ')}`:''}
  <div class="grp">Cables (${cs.length.toLocaleString('ru-RU')})</div>${ctable(cs.slice(0,300))}${cs.length>300?'<div class="mut small" style="margin-top:6px">First 300 shown – type more of the tag</div>':''}
  ${cs.length?`<div style="margin-top:10px"><button class="sec" onclick="csv(search.L,'search')">⬇ CSV of these cables</button></div>`:''}`; search.L=cs; }
function csv(L,name){ const K=['t','tit','doc','f','o','ty','sz','id','ln','act','du','da','pd','ps','tf','tt','ts','co','hold','mrf','rfi'];
  const s='﻿'+K.join(';')+'\n'+L.map(o=>K.map(k=>'"'+String(o[k]??'').replace(/"/g,'""').replace(/\n/g,' ')+'"').join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'})); a.download=name+'.csv'; a.click(); }
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
