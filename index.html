<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#023362">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rencons CCR Site App</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#18202b;--mut:#687384;--line:#e1e5ea;--pri:#023362;--pri2:#012447;--acc:#f69176;--ok:#1e8a4c;--okbg:#e0f3e7;--warn:#8a5a00;--warnbg:#fff2d8;--bad:#b42318;--badbg:#fde6e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;padding:10px 14px 12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:10px}.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;width:38px;height:38px;font-size:18px;flex:none}
.lng{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#cfd6df;border-radius:19px;height:30px;padding:0 4px;font-size:12px;font-weight:700;flex:none;display:flex;align-items:center;gap:1px;letter-spacing:.3px}.lng i{font-style:normal;opacity:.5}.lng span{padding:2px 6px;border-radius:10px}.lng span.on{background:#f69176;color:#fff}
.htitle{flex:1;min-width:0}.htitle b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.htitle span{font-size:12px;opacity:.8}
.search{margin-top:10px;position:relative}.search input{width:100%;padding:12px 12px 12px 38px;border:0;border-radius:10px;font-size:16px;background:#fff}
.search:before{content:'⌕';position:absolute;left:12px;top:8px;font-size:20px;color:#8a93a1}
main{padding:12px 12px 40px;max-width:860px;margin:0 auto}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.kpi div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--mut)}
.sect{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:inherit;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-size:14px;line-height:1.25}.tile .n{font-size:12px;color:var(--mut)}.tile.main{background:var(--pri);color:#fff;border-color:var(--pri)}.tile.main .n{color:#d6e4f2}
.pbar{height:6px;background:#e7ebf0;border-radius:4px;overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--ok)}.tile.main .pbar{background:rgba(255,255,255,.25)}.tile.main .pbar i{background:var(--acc)}
.pc{font-weight:700;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:7px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;margin-bottom:8px}
.fin{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;margin-bottom:8px}
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:11px 12px;font:inherit;color:inherit}
.li:last-child{border-bottom:0}.li .m{flex:1;min-width:0}.li .t{font-weight:600;font-size:14px;word-break:break-all}.li .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{text-align:right;flex:none;font-size:12px;color:var(--mut)}.chev{color:#b5bcc6;font-size:18px}
.gh{background:#eef2f6;padding:7px 12px;font-size:12px;font-weight:700;color:var(--pri2);border-bottom:1px solid var(--line)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;white-space:nowrap}
.b-ok{background:var(--okbg);color:#0f5a30}.b-part{background:var(--warnbg);color:var(--warn)}.b-no{background:var(--badbg);color:var(--bad)}.b-na{background:#eceff3;color:#555}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.big{font-size:18px;font-weight:700;word-break:break-all}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:14px;margin-top:4px}.kv div:nth-child(odd){color:var(--mut);font-size:13px}.kv div:nth-child(even){word-break:break-word}
.h3{font-size:12px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px}
.note{background:var(--warnbg);border-radius:9px;padding:9px;font-size:13px;margin-top:6px;white-space:pre-wrap}
.link{color:var(--pri);text-decoration:underline;cursor:pointer}
.more{width:100%;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fff;color:var(--pri);font-size:14px;margin-top:8px}
.foot{font-size:11px;color:var(--mut);text-align:center;margin:18px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18202b;color:#fff;padding:10px 14px;border-radius:9px;font-size:14px;display:none;z-index:9;max-width:90%}
.cbx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.cbx.ok{border-left:5px solid var(--ok)}.cbx.part{border-left:5px solid #e0a100}.cbx.no{border-left:5px solid var(--bad)}.s2{font-size:12px;color:var(--mut)}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.tg{padding:9px 4px;border-radius:8px;border:1px solid var(--line);background:#f7f8fa;font-size:12px;line-height:1.2}.tg.y{background:var(--okbg);border-color:var(--ok);color:#0f5a30;font-weight:700}.tg.n{background:var(--badbg);border-color:#e6a49c;color:#8f2a20}.tg small{display:block;font-size:10px;font-weight:400;opacity:.8}
.rep{position:sticky;bottom:0}
.empty{padding:20px;text-align:center;color:var(--mut);font-size:14px}
.mgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:700px){.mgs{grid-template-columns:repeat(6,1fr)}}
.mgk{background:var(--pri);color:#fff;border-radius:12px;padding:10px 8px;text-align:center}.mgk.bad{background:var(--acc)}.mgk b{display:block;font-size:24px;line-height:1.1}.mgk span{display:block;font-size:11px;font-weight:600;margin-top:2px}.mgk i{display:block;font-style:normal;font-size:10px;opacity:.85;margin-top:2px}
.mgf{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:6px}.mgf .fin,.mgf select{margin:0}@media(min-width:600px){.mgf{grid-template-columns:2fr 1fr 1fr}}
.mgw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}.mgtb{width:100%;border-collapse:collapse;font-size:13px}.mgtb th{position:sticky;top:0;background:var(--pri);color:#fff;text-align:left;padding:7px 8px;font-size:12px}.mgtb td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}.mgtb td:first-child{white-space:normal;word-break:break-all}
.mgbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 42px;gap:8px;align-items:center;padding:5px 0;cursor:pointer;font-size:12px}.mgbar .n{word-break:break-all}.mgbar .b{height:14px;background:var(--pri);border-radius:7px;overflow:hidden}.mgbar .b i{display:block;height:100%;background:var(--acc)}.mgbar .v{text-align:right;font-weight:700}
</style>
</head>

 var DC='appdata-v1',FRESH=15*60*1000;
 function cget(f){if(!('caches' in window))return Promise.resolve(null);return caches.open(DC).then(function(c){return c.match(f);}).then(function(r){return r?r.json():null;}).catch(function(){return null;});}
 function net(f){return fetch(f+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 'HTTP '+r.status+' '+f;var c2=r.clone();if('caches' in window)caches.open(DC).then(function(c){return c.put(f,c2);}).catch(function(){});try{localStorage.setItem('dt_'+f,String(Date.now()));}catch(e){}return r.json();});}
 function age(f){try{return Date.now()-Number(localStorage.getItem('dt_'+f)||0);}catch(e){return 1e12;}}
 function bar(msg){var b=document.createElement('div');b.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:9999;background:#023362;color:#fff;padding:12px 14px;border-radius:12px;font:14px/1.3 inherit;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';b.innerHTML=msg;b.onclick=function(){location.reload();};document.body.appendChild(b);}
 function bg(cd){if(age(DF)<FRESH&&age(EF)<FRESH)return;setTimeout(function(){
   net(EF).catch(function(){});
   net(DF).then(function(d){if(ok(d)&&d.meta&&cd.meta&&d.meta.ver!==cd.meta.ver)bar('🔄 '+LT('New data','Новые данные')+' '+(d.meta.date||'')+' – '+LT('tap to load','нажмите, чтобы загрузить'));}).catch(function(){});},2500);}
 function eng(d){return net(EF).catch(function(){return cget(EF);}).then(function(e){window.__E=e||{};return d;});}
 function online(){return net(DF).then(function(d){if(ok(d))return d;if(t)t.textContent=LT('Daily data has a different format – loading last good data...','Ежедневные данные в другом формате – загружаю последние рабочие данные...');
   return get(BF).then(function(b){if(!ok(b))throw BF+' has wrong format';b.__fb={date:(d&&d.meta&&d.meta.date)||'?',ver:(d&&d.meta&&d.meta.ver)||''};return b;});})
 .catch(function(e){if(t)t.textContent=LT('Loading last good data...','Загрузка последних рабочих данных...');return get(BF).then(function(b){if(!ok(b))throw e;b.__fb={date:'?',ver:'',err:String(e)};return b;});})
 .then(eng).then(function(d){if(t)t.textContent=LT('Preparing your app...','Подготовка приложения...');start(d);}).catch(function(e){fail(e);});}
 cget(DF).then(function(cd){
   if(!ok(cd))return online();
   if(t)t.textContent=LT('Opening saved data...','Открываю сохранённые данные...');
   return cget(EF).then(function(ce){window.__E=ce||{};start(cd);bg(cd);});
 }).catch(function(){online();});})();
</script>
</body>
</html>
